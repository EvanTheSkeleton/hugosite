greeting: Hi, I'm Evan!
person_name: Currently I do work as a UW-Platteville Student and Goodwill Cashier.
summary: My professional work involes surveying the psychology of how people interact in specific contexts, observing the core individual underlying components of interactions, then identifying my users and developing unique considerate ideas quickly. I really enjoy and excel at the logistics in creating scaleable systems of divided responsibility across wide computer networks.
details:
    - I always find myself analytical in nature and enjoy making other people happy. Computers have always opened up an entirely new, open universe with all of the flashy banners, the networking and the whole exchange of data, etc is something that has always been super cool to me since a young age. What makes me interesting is I also find common interest in different issues from diciplines such as Philosophy, Psychology, Ethics, Law/Crime, Politics, Human Behavior, Biology, and other topic in relation to how people do the things that they do and why. Since I was little, I would find interest in or notice things that often get completly missed by any other person, like when I was at the fireworks and I was the only one noticing the sound reflection and the cool light reflection in the windows of a tall building or me being the only one at a water park noticing a music delay from where I am standing to the speaker on the other side of the park. This plays an important role in how I come up with the ideas that I do, and how I network with others and find many users with a similar problem that they may or may not have realized they had so quickly. I always take a liking for doing the right thing for somebody, it is a fantastic feeling to be able to spot these little things that turn out to be a massive deal for somebody, I take pride in my job for that reason.

    -

    - Outside of tech related stuff, I enjoy going on adventures. I like to hike, ski, drive atvs/boats/cars/etc (I have a goal to get a pilots license one day). I do code a lot in my free time, but casually when needing a break I am a gamer and play some open world or strategy like games. Some of my favorites include Minecraft, Stardew Valley, Antivirus Survivors 2003, Mini Motorways, Geometry Dash, Rebel Inc, and a few others. I am also do diy projects, repair jobs, or janky upgrades/challenges.. like what is the cheapest drone I could do that streams fantastic video as an example, where it all started with a old drone found at Goodwill with many connectors and lots of room in the shell.

